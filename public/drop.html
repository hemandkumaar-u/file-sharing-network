<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Files</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="drop-layout">

    <div class="drop-container">
        <h1>Send to PC</h1>
        <p class="subtitle">Drop files anywhere to upload instantly</p>

        <div class="drop-zone" id="dropZone">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <div class="drop-text">Tap or drag files here</div>
            <div class="drop-hint">Supports photos, videos, and documents</div>
            <span class="upload-btn">Browse Files</span>
            <input type="file" id="fileInput" multiple>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status-text">
                <span id="statusMessage">Uploading...</span>
                <span id="percentText">0%</span>
            </div>
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script src="/js/drop.js"></script>
</body>
</html>
